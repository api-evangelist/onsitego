name: Onsitego
description: 'Onsitego is a Mumbai-based Indian consumer device-protection company that
  sells extended warranty, accidental and liquid damage protection, and repair and
  maintenance (AMC) plans for consumer electronics and home appliances including mobile
  phones, laptops, televisions, refrigerators, washing machines and air conditioners.
  Sold at point of sale through 10,000+ retail stores and serviced via 3,300+ service
  centers, the company reports 2.5+ crore (25M+) customers and lets buyers activate
  coverage, manage devices and plans, and request service online. Onsitego is a portfolio
  company of Accel. No public developer API, documentation, or programmatic surface was
  found during enrichment; this profile captures the company identity and probed domain
  security posture.'
